version: 2

models:
  - name: stg_orders_payments_reconciled
    description: >
      One row per order, left joined to its payment. Orders carrying no payment
      row keep null payment columns; has_payment marks that absence explicitly
      so it is never mistaken for a measured zero.
    columns:
      - name: order_id
      - name: order_status
      - name: total_amount
      - name: ordered_at
      - name: payment_id
      - name: payment_amount
      - name: payment_method
      - name: payment_status
      - name: paid_at
      - name: has_payment
        description: True when a payment row exists for the order.
